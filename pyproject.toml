[tool.ruff]
line-length = 100
target-version = 'py311'
exclude = [
    '.venv*',
    'venv*',
    'build',
    'dist',
]

[tool.ruff.lint]
select = ['E', 'F', 'W', 'I']
# E266: too many leading '#' for block comment
# E501: line too long - handled by the formatter
# E701: multiple statements on one line (colon) - conflicts with empty class definitions
#   formatted by ruff as `class FileUpdateError(Exception): ...`
# F811: redefinition of unused name from import (happens when importing pytest fixtures)
extend-ignore = ['E266', 'E501', 'E701', 'F811']

[tool.ruff.lint.isort]
# Default section order: FUTURE, STDLIB, THIRDPARTY, FIRSTPARTY, LOCALFOLDER

[tool.ruff.format]
quote-style = 'single'

[tool.pytest.ini_options]
pythonpath = ['src']
testpaths = ['tests']
addopts = ['--strict-markers', '-v']

[tool.mypy]
python_version = '3.11'
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
mypy_path = 'src'
#explicit_package_bases = true
#packages = ['src']
exclude = [
    '.venv.*', 'venv.*'
]

[[tool.mypy.overrides]]
module = []
ignore_missing_imports = true

[tool.typer-invoke]
# Paths from where `pyproject.toml` is located (root of project)
modules = [
    'admin.build',
    'admin.lint',
    'admin.pip',
    'admin.test',
    'sample.hello'
]
no_args_is_help = true
add_completion = false
rich_markup_mode = 'markdown'
log_level = 'INFO'
log_format = '%(message)s'

[build-system]
requires = ['uv_build>=0.10.4,<0.11.0']
build-backend = 'uv_build'

[project]
name = 'typer-invoke'
version = '0.5.0'
description = 'Simplified invocation of typer apps from any directory.'
readme = 'README.md'
authors = [{name = 'Joao Coelho'}]
license = 'MIT'
license-files = ['LICENSE.txt']
requires-python = '>=3.11'
# Keep dependencies synced with `requirements.in`
dependencies = [
    'rich',
    'typer',
]
# https://pypi.org/pypi?%3Aaction=list_classifiers
classifiers = [
    'License :: OSI Approved :: MIT License',
    'Framework :: Pytest',
    'Intended Audience :: Developers',
    'Programming Language :: Python',
    'Development Status :: 4 - Beta'
]

[project.urls]
Home = 'https://github.com/joaonc/typer-invoke'

[project.scripts]
inv = 'typer_invoke.invoke:main'
